
services:
  backend:
    build:
      context: ./backend
    container_name: twin_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/twin_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    depends_on:
      - postgres
      - neo4j
      - redis
      - rabbitmq
    networks:
      - twin_net

  frontend:
    build:
      context: ./frontend
    container_name: twin_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - twin_net

  postgres:
    image: postgres:15-alpine
    container_name: twin_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=twin_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - twin_net

  neo4j:
    image: neo4j:5-community
    container_name: twin_neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data
    networks:
      - twin_net

  redis:
    image: redis:7-alpine
    container_name: twin_redis
    ports:
      - "6379:6379"
    networks:
      - twin_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: twin_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    networks:
      - twin_net

networks:
  twin_net:
    driver: bridge

volumes:
  pgdata:
  neo4jdata:
