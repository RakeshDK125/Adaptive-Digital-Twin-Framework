version: '3.8'

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/digital_twin
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
    networks:
      - twin_net

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=digital_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - twin_net

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - twin_net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - twin_net

volumes:
  postgres_data:
  neo4j_data:

networks:
  twin_net:
    driver: bridge
